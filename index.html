<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RE/MAX × WeDo — דשבורד פודקאסטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --d-fast:250ms; --d-quick:150ms; --ease:cubic-bezier(.22,1,.36,1);
  --bg:#0b0e15; --card:#151a25; --card2:#1b2230; --bd:rgba(255,255,255,.09); --bd2:rgba(255,255,255,.17);
  --tx:#f1f3f8; --mut:#9aa2b2; --mut2:#6b7488;
  --reach:#36d6c6; --deep:#f3a23e; --good:#46c98a; --warn:#e0b34d;
  --ig:#ec5e9c; --fb:#4d8df5; --yt:#ff6a5a; --sp:#39d077; --ap:#a87bf0; --male:#4d8df5; --female:#ec5e9c; --nb:#a87bf0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";font-size:15px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 70px}
svg.ic{width:15px;height:15px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
a{color:inherit}
.vsw{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding:12px 0 4px}
.vsw a{font-size:12.5px;font-weight:600;color:var(--mut);text-decoration:none;padding:6px 13px;border:1px solid var(--bd);border-radius:20px;cursor:pointer;transition:all var(--d-fast)}
.vsw a:hover{color:var(--tx);border-color:var(--bd2)}
.vsw .edit.on{background:rgba(243,162,62,.16);color:var(--deep);border-color:rgba(243,162,62,.4)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 0 10px}
.brand{font-weight:900;font-size:18px;display:flex;align-items:center;gap:9px}.brand .s{color:var(--mut2);font-weight:300}.brand .r{color:var(--reach)}.brand .lg{height:24px;width:auto;vertical-align:middle;object-fit:contain}.brand .lg.wd{background:#fff;border-radius:5px;padding:3px 5px}
.hmeta{font-size:12px;color:var(--mut);text-align:left}
.tabwrap{position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg),var(--bg) 72%,transparent);padding:6px 0 12px}
.tabs{display:flex;gap:5px;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:5px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 14px;border:none;background:none;color:var(--mut);font-family:inherit;font-size:13.5px;font-weight:600;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background var(--d-fast),color var(--d-fast)}
.tab[aria-selected="true"]{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd2)}
.tab.star[aria-selected="true"]{color:var(--deep);box-shadow:inset 0 0 0 1px rgba(243,162,62,.4)}
.panel{display:none}.panel.on{display:block;animation:fade var(--d-fast) var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 16px;margin-bottom:16px;position:relative}
.status .it{display:flex;align-items:center;gap:7px}.status .it b{color:var(--tx);font-weight:700}
.status .sep{width:1px;height:15px;background:var(--bd2)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(70,201,138,.18)}
.block{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px 17px;margin-bottom:14px;position:relative}
.block.reach{border-top:3px solid var(--reach)}.block.deep{border-top:3px solid var(--deep)}
.bh{display:flex;align-items:center;gap:9px;margin-bottom:3px;flex-wrap:wrap}
.bh h3{font-size:15.5px;font-weight:800}
.btag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px}
.btag.r{background:rgba(54,214,198,.14);color:var(--reach)}.btag.d{background:rgba(243,162,62,.14);color:var(--deep)}
.sub{font-size:12.5px;color:var(--mut);margin-bottom:12px}
.explain{font-size:12px;color:var(--mut2);line-height:1.5;margin-top:8px}.explain b{color:var(--mut);font-weight:600}
/* tooltip — floating, position:fixed via JS, never clipped or hidden */
.tip{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--card2);border:1px solid var(--bd2);color:var(--mut);font-size:10px;font-weight:800;cursor:help;margin-inline-start:5px;vertical-align:middle;flex:0 0 auto}
.tip:hover,.tip.active{background:var(--deep);color:#1a1206;border-color:var(--deep)}
.tipfloat{position:fixed;background:#232e40;border:1px solid var(--bd2);border-radius:10px;padding:9px 12px;font-size:12px;font-weight:500;color:var(--tx);max-width:min(280px,82vw);line-height:1.55;z-index:9999;box-shadow:0 14px 36px rgba(0,0,0,.65);pointer-events:none;opacity:0;transition:opacity .12s;text-align:right;white-space:normal}
.tipfloat.show{opacity:1}
.refbadge{display:none;position:absolute;top:-8px;inset-inline-start:12px;background:var(--deep);color:#1a1206;font-size:11px;font-weight:800;padding:1px 8px;border-radius:7px;letter-spacing:.3px;z-index:5}
body.editmode .refbadge{display:inline-block}
body.editmode .block,body.editmode .statcard,body.editmode .status{outline:1px dashed rgba(243,162,62,.35)}
body.editmode [data-ekey]{outline:1px dashed rgba(54,214,198,.55);outline-offset:2px;border-radius:4px;cursor:text}
body.editmode [data-ekey]:focus{outline:2px solid var(--reach);background:rgba(54,214,198,.08)}
/* stat cards */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:16px}
.statgrid.four{grid-template-columns:repeat(4,1fr)}
.statcard{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:16px 18px;position:relative;overflow:hidden}
.statcard.lead{border-top:3px solid var(--deep)}.statcard.r{border-top:3px solid var(--reach)}
.statcard .ico{position:absolute;top:14px;inset-inline-end:15px;color:var(--mut2);opacity:.7}.statcard .ico svg{width:18px;height:18px}
.statcard .t{font-size:12.5px;color:var(--mut);font-weight:600;display:flex;align-items:center}
.statcard .v{font-size:36px;font-weight:900;letter-spacing:-1.4px;line-height:1.05;margin:6px 0 5px}
.statcard .v.deep{color:var(--deep)}.statcard .v.reach{color:var(--reach)}
.statcard .x{font-size:11.5px;color:var(--mut2);line-height:1.5}
.epstat{display:inline-flex;align-items:baseline;gap:3px}.epstat .ep{color:var(--mut2);font-size:22px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;color:var(--mut);font-weight:600;text-align:right;padding:0 9px 9px;white-space:nowrap}
td{padding:9px;border-top:1px solid rgba(255,255,255,.06);vertical-align:middle}
td.nm{font-weight:700;white-space:nowrap}
.cell{position:relative}.cellbar{position:absolute;inset:0;border-radius:6px;opacity:.16;z-index:0}.cellv{position:relative;z-index:1;font-weight:600}
td.tot{font-weight:800;color:var(--deep)}
.scroll{overflow-x:auto;scrollbar-width:thin}
.miniretain{display:inline-flex;align-items:center;gap:6px}.miniretain .rb{width:42px;height:6px;background:var(--bg);border-radius:4px;overflow:hidden}.miniretain .rb>span{display:block;height:100%;background:var(--deep);border-radius:4px}
td.eps b{font-weight:800;color:var(--tx)}td.eps .epd{color:var(--mut2);font-size:11.5px}
/* rank matrix */
.mx{border-collapse:separate;border-spacing:0;font-size:13.5px}
.mx th,.mx td{text-align:center;padding:8px 10px}
.mx th:first-child,.mx td:first-child{text-align:right;white-space:nowrap}
.mx td{border-top:1px solid rgba(255,255,255,.06);position:relative}
.mx .ml{font-weight:600;color:var(--mut);cursor:pointer}.mx .ml:hover{color:var(--tx)}
.mx .mcell{position:relative}.mx .mbar{position:absolute;inset:3px;border-radius:5px;opacity:.15;z-index:0}.mx .mv{position:relative;z-index:1;font-weight:700;font-variant-numeric:tabular-nums}
.mx .lead-cell .mv{color:var(--deep)}.mx .lead-cell .mbar{opacity:.22}
.mxexp{font-size:12px;color:var(--mut);background:var(--card2);border-radius:8px;padding:8px 11px;margin:2px 0}
/* funnel */
.fmeta{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:11px;font-size:12.5px;color:var(--mut)}
.fmeta b{color:var(--tx);font-weight:800;font-size:15px}
.fmeta .it{display:flex;flex-direction:column;gap:1px}
.funnel{display:flex;gap:9px;align-items:stretch}
.fseg{flex:1 1 0;background:var(--card2);border:1px solid var(--bd);border-radius:11px;padding:11px 13px}
.fseg .fl{font-size:11.5px;color:var(--mut);font-weight:600;display:flex;align-items:center}
.fseg .fv{font-size:24px;font-weight:900;letter-spacing:-.8px;margin-top:2px}
.fseg .fx{font-size:10.5px;color:var(--mut2);margin-top:1px}
.fseg.s1 .fv{color:#7d8ba8}.fseg.s2 .fv{color:#5a9bd6}.fseg.s3 .fv{color:var(--reach)}
.fconn{flex:0 0 auto;display:grid;place-items:center;min-width:44px}.fconn .pct{font-size:14px;font-weight:900;color:var(--tx)}.fconn .ar{color:var(--mut2);font-size:11px}
/* demo / sources bars */
.bars .bl{display:grid;grid-template-columns:96px 1fr 52px;gap:8px;align-items:center;font-size:12.5px;color:var(--mut);padding:3.5px 0}
.bars .bb{height:9px;background:var(--bg);border-radius:5px;overflow:hidden;display:flex}.bars .bb>span{display:block;height:100%}
.bars .bl .num{color:var(--tx);font-weight:600;text-align:left}
.depthmm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.depthmm .mmcell{background:var(--bg);border:1px solid var(--bd);border-radius:11px;padding:10px 11px 4px}
.depthmm .mmh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:2px}
.depthmm .mmh .nm{font-size:12.5px;font-weight:700;color:var(--tx)}
.depthmm .mmh .pc{font-size:11.5px;font-weight:800;color:var(--deep);white-space:nowrap}
.depthmm .mmh .pc.yt{color:var(--yt)}
.depthmm .mmfb{font-size:11.5px;color:var(--mut2);padding:28px 4px;text-align:center;line-height:1.5}
.depthmm .mmsp{font-size:10.5px;color:var(--mut2);text-align:center;margin-top:-2px;padding-bottom:3px}
.daxwrap{display:grid;grid-template-columns:36px 1fr;grid-template-rows:168px auto;direction:ltr;margin-top:4px}
.daxwrap .dayax{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;padding-right:7px;font-size:10px;color:var(--mut2)}
.daxwrap .daplot{grid-column:2;grid-row:1}
.daxwrap .daxax{grid-column:2;grid-row:2;display:flex;justify-content:space-between;font-size:10px;color:var(--mut);padding-top:5px}
.daplot{position:relative;height:100%}
.daplot.mini{height:86px}
.daplot .dadot{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--deep);transform:translate(-50%,50%);box-shadow:0 0 0 2px var(--card)}
.ytdepth{display:flex;align-items:center;gap:14px;padding:8px 2px}
.ytdepth .v{font-size:40px;font-weight:900;color:var(--deep);letter-spacing:-1.5px;line-height:1}
.ytdepth .x{font-size:12.5px;color:var(--mut);line-height:1.5}
@media(max-width:760px){.depthmm{grid-template-columns:1fr 1fr}}
.demo .dl{display:grid;grid-template-columns:58px 1fr 38px;gap:8px;align-items:center;font-size:12px;color:var(--mut);padding:3px 0}
.demo .db{height:9px;background:var(--bg);border-radius:5px;overflow:hidden;display:flex}.demo .db>span{display:block;height:100%}
.demo .dl .num{color:var(--tx);font-weight:600;text-align:left}
.glegend{display:flex;gap:12px;font-size:11px;color:var(--mut2);margin-bottom:8px;flex-wrap:wrap}.glegend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-inline-end:4px;vertical-align:-1px}
.chrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:11px}
.chip{flex:1 1 110px;background:var(--card2);border:1px solid var(--bd);border-radius:11px;padding:9px 12px}
.chip .cn{font-size:18px;font-weight:800}.chip .cl{font-size:11px;color:var(--mut2);margin-top:1px}
/* social */
.pg{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.pg:first-child{border-top:none}
.pg .nm{font-weight:600}.pg .nm a{text-decoration:none;border-bottom:1px dotted var(--mut2);cursor:pointer}.pg .nm a:hover{border-bottom-style:solid}
.tag-sm{font-size:10px;color:var(--mut2);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 7px;margin-inline-start:6px}
.pg .meta{font-size:11px;color:var(--mut2);margin-top:1px}
.pg .vv{font-size:16px;font-weight:800;text-align:left;white-space:nowrap}
.pg .bar{grid-column:1/-1;height:6px;background:var(--bg);border-radius:5px;overflow:hidden}.pg .bar>span{display:block;height:100%;border-radius:5px}
.post{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;text-decoration:none;color:inherit;margin-bottom:7px;transition:border-color var(--d-quick)}
.post:hover{border-color:var(--bd2)}
.post .pl{font-size:13px;font-weight:600}.post .pl .lk{font-size:11px;color:var(--reach);margin-inline-start:6px}.post .pmeta{font-size:11px;color:var(--mut2);margin-top:2px}.post .pv{font-size:16px;font-weight:800;white-space:nowrap}
.curvebox{height:140px;max-width:600px;margin:6px auto 0}
.gl{stroke:rgba(255,255,255,.06);stroke-width:1}.glt{fill:var(--mut2);font-size:9.5px}.xlab{fill:var(--mut2);font-size:9.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two3{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
/* benchmark */
.bbar{display:flex;flex-direction:column;gap:10px}
.bbrow{display:grid;grid-template-columns:180px 1fr auto;gap:11px;align-items:center;font-size:13px}
.bbrow .bl2{color:var(--mut)}.bbrow .bl2 b{color:var(--tx);font-weight:700}
.bbrow .bw{height:22px;background:var(--bg);border-radius:6px;overflow:hidden}.bbrow .bf{height:100%;border-radius:6px}
.bbrow .bv{font-weight:800;white-space:nowrap}.bbrow .bv .sm{color:var(--mut2);font-weight:500;font-size:11px}
.proj{background:rgba(243,162,62,.07);border:1px solid rgba(243,162,62,.22);border-radius:12px;padding:13px 15px}
.proj .pt{font-size:11px;font-weight:800;color:var(--deep);letter-spacing:.4px;margin-bottom:5px}
.note{font-size:11px;color:var(--mut2);font-style:italic;margin-top:7px;line-height:1.5}
.story{list-style:none;display:flex;flex-direction:column;gap:10px}.story li{padding-inline-start:24px;position:relative;font-size:13px;line-height:1.55;color:#d6dae4}.story li:before{content:"";position:absolute;inset-inline-start:5px;top:8px;width:7px;height:7px;border-radius:3px;background:var(--deep)}
/* insights */
.ins .insrow{padding:9px 0;border-top:1px solid rgba(255,255,255,.05)}
.ins .insrow:first-child{border-top:none}
.ins .insname{font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--tx)}
.ins .insrow .bars{margin:0}
.ins .bars .bl{grid-template-columns:104px 1fr 72px;font-size:12px}
.inssub{font-size:11.5px;color:var(--mut2);margin-bottom:9px}
.inssw{font-size:12.5px;color:#cfd4de;line-height:1.65;margin-top:13px;border-top:1px solid var(--bd);padding-top:10px}
.insnote{font-size:11px;color:var(--mut2);font-style:italic;margin-top:7px}
.eprow{padding:5px 0;border-top:1px solid rgba(255,255,255,.04)}.eprow:first-child{border-top:none}
.eptop{display:flex;justify-content:space-between;gap:8px;font-size:12px;align-items:baseline}
.eptop .ept{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eptop .epv{color:var(--tx);font-weight:700;white-space:nowrap}
.epbar{height:5px;background:var(--bg);border-radius:4px;margin-top:3px;overflow:hidden}.epbar>span{display:block;height:100%;background:var(--deep);border-radius:4px}
/* growth */
.gbtns{display:inline-flex;gap:2px;margin:10px 8px 0 0;background:var(--bg);border:1px solid var(--bd);border-radius:11px;padding:3px;flex-wrap:wrap;vertical-align:middle}
.gbtn{background:transparent;border:none;color:var(--mut);font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 15px;border-radius:8px;cursor:pointer;transition:all var(--d-quick)}
.gbtn:hover{color:var(--tx)}
.gbtn.on{background:var(--deep);color:#1a1206}
.gchart{margin-top:10px;overflow-x:auto}
.gplot{display:flex;align-items:flex-end;justify-content:center;gap:min(18px,2%);height:190px;margin-top:6px;padding:0 10px 0 8px;direction:ltr;border-bottom:2px solid rgba(255,255,255,.22);border-left:1.5px solid rgba(255,255,255,.12);background:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:100% 33.33%}
.gbar{flex:1 1 0;min-width:34px;max-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.gcol{display:block;width:66%;max-width:48px;min-width:13px;background:var(--deep);border-radius:6px 6px 0 0;min-height:3px}
.gv{font-size:15px;font-weight:800;color:var(--tx);margin-bottom:7px}
.gaxis{display:flex;justify-content:center;gap:min(18px,2%);direction:ltr;padding:9px 10px 0 8px}
.gaxis>div{flex:1 1 0;min-width:34px;max-width:120px;text-align:center;font-size:13px;font-weight:600;color:#cfd5e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gplot.grouped,.gaxis.grouped{gap:26px;padding-left:14px;justify-content:flex-start;flex-wrap:nowrap}
.gaxis.grouped>div{flex:0 0 auto;min-width:0;max-width:none}
.ggroup{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;gap:4px;height:100%}
.gmini{display:block;width:15px;border-radius:3px 3px 0 0;min-height:2px}
.glegend2{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 8px;font-size:12px;color:var(--mut)}
.glegend2 span{display:inline-flex;align-items:center}
.glegend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-start:5px}
.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn{background:var(--card2);border:1px solid var(--bd);color:var(--tx);font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.btn:hover{border-color:var(--bd2)}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--bd);font-size:11px;color:var(--mut2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#1d2433;border:1px solid var(--bd2);padding:10px 18px;border-radius:11px;font-size:13.5px;opacity:0;transition:all var(--d-fast) var(--ease);z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:760px){
  .statgrid,.statgrid.four{grid-template-columns:1fr 1fr;gap:9px}.statcard .v{font-size:27px}
  .two,.two3{grid-template-columns:1fr}.funnel{flex-direction:column}.fseg{flex:0 0 auto}.fconn{min-height:26px;min-width:0;transform:none}.fconn .ar{display:inline-block;transform:rotate(-90deg)}
  .bbrow{grid-template-columns:1fr;gap:3px}.bars .bl{grid-template-columns:80px 1fr 44px}
  table{font-size:12.5px}td,th{padding-inline:5px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="vsw"><a class="edit" id="exportEdits">⬇ ייצוא שינויים</a><a class="edit" id="editToggle">✎ מצב עריכה</a></div>

<script>
(function(){
"use strict";
var D=(window&&window.DASHBOARD_DATA)||null;
function nf(n){return (n==null||isNaN(n))?'–':Math.round(n).toLocaleString('en-US');}
function kf(n){return (n==null||isNaN(n))?'–':(n>=1000?(Math.round(n/100)/10).toLocaleString('en-US')+'K':Math.round(n).toLocaleString('en-US'));}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function RB(r){return '<span class="refbadge">'+r+'</span>';}
function pct(a,b){return b?Math.round(100*a/b):0;}
var COL={ig:'#ec5e9c',fb:'#4d8df5',yt:'#ff6a5a',sp:'#39d077',ap:'#a87bf0',reach:'#36d6c6',deep:'#f3a23e',male:'#4d8df5',female:'#ec5e9c',nb:'#a87bf0'};
if(!D){$('panels').innerHTML='<div class="block"><div class="bh"><h3>שגיאה בטעינת נתונים</h3></div></div>';return;}
var m=D.meta||{};
if($('org'))$('org').textContent=m.organic_note||'';
if($('range'))$('range').textContent=m.range||'';
if($('fresh'))$('fresh').textContent=m.freshness||'';
if($('sources'))$('sources').textContent='מקורות: '+((m.sources||[]).join(' · '));

var TIPS={
  deep:'צפיות ביוטיוב והאזנות בספוטיפיי לפרקים עצמם (לא לרילס), כפי שכל פלטפורמה סופרת אותן.',
  reach:'כמה פעמים רילס נצפה. מדד רחב ונפרד מההאזנה לפרקים.',
  conv:'מתוך כל הפעמים שספוטיפיי הציג את התוכנית — איזה אחוז הפך להשמעה. כך ספוטיפיי מחשבים אותו בעמוד "Discovery".',
  plays:'כמה פעמים התחילו לנגן פרק בספוטיפיי ב-30 הימים האחרונים.',
  ytret:'איזה אחוז מאורך הסרטון נצפה בממוצע בכל צפייה. 20% = בממוצע נצפתה חמישית מהסרטון.',
  unique:'מספר האנשים השונים שצפו ביוטיוב — בלי לספור צפיות חוזרות של אותו אדם.',
  reached:'ספוטיפיי הציג להם את התוכנית — בחיפוש או במסך הבית.',
  interested:'נכנסו לעמוד התוכנית כדי לבדוק.',
  consumed:'התחילו להאזין לפרק בפועל.',
  impressions:'כמה פעמים ספוטיפיי הציג את התוכנית למישהו ב-30 הימים האחרונים — חשיפה, עוד לפני האזנה.',
  audience:'מספר האנשים השונים שנחשפו בפועל (לא כמה פעמים הוצג).',
  foreground:'איזה אחוז מההאזנה היה כשהאפליקציה פתוחה ובפוקוס — לא ברקע תוך כדי נהיגה או עבודה. מדד לאיכות ההקשבה.',
  median:'הזמן שבו המאזין החציוני עדיין החזיק בפרק (חצי עזבו לפניו, חצי אחריו).',
  curve:'מתוך מי שהתחיל את הפרק — איזה אחוז החזיק עד כל נקודה. 100% = הגיעו לסוף.',
  depth:'איזה אחוז מהפרק נצרך בפועל בספוטיפיי (שטח מתחת לעקומת השימור). 60% = בממוצע מאזינים לשישים אחוז מהפרק. שימור יוטיוב מוצג בנפרד כי הוא מדד נמוך יותר מטבעו (סופר גם מי שלחץ ונטש מיד).',
  episodes:'כל תוכנית מתוכננת ל-26 פרקים (12 לתוכנית של ברנרד). כאן נספרים פרקים שכבר פורסמו — בטאב "סטטוס" מוצגים גם הפרקים שצולמו וטרם פורסמו.',
  watch:'סך כל שעות הצפייה המצטברות ביוטיוב.',
  traffic:'דרך איזה ערוץ הגיעו הצופים לסרטונים ביוטיוב (חיצוני = לינק מאתר/רשת אחרת).',
  source_social:'החשיפה שייכת לעמוד שבו עלה הפוסט, לא לתוכנית — לכן זה מדד נפרד.',
  ctr:'מתוך מי שראה את התמונה הממוזערת ביוטיוב — איזה אחוז לחץ.',
  apps:'באיזו אפליקציה מאזינים בפועל — ספוטיפיי, אפל, או דפדפן.',
  ret30:'מתוך מי שהתחיל את הסרטון ביוטיוב — כמה החזיקו מעבר ל-30 השניות הראשונות.',
  people:'סך האנשים השונים — צופים ייחודיים ביוטיוב + קהל שנחשף בספוטיפיי. ייתכן חפיפה קטנה בין הפלטפורמות.'
};
function tip(k){var t=TIPS[k];return t?'<span class="tip" tabindex="0" data-tiptext="'+esc(t)+'">?</span>':'';}

var o=D.overview||{},shows=(D.shows||[]).slice(),social=D.social||{by_page:[],posts:[]},B=D.benchmark||{},yc=D.youtube_channel||{};
var totDeep=(o.deep_listens!=null)?o.deep_listens:shows.reduce(function(a,s){return a+(s.deep_total||0);},0);
var totReach=(social.total_views!=null)?social.total_views:(o.reach_reels||0);
var EP_PLANNED=26;
var STATUS=D.status||{summary:{},programs:[],assets:[]};
function pubEps(s){return (s.curves&&s.curves.length)||(s.episodes&&s.episodes.length)||0;}
var totPub=shows.reduce(function(a,s){return a+pubEps(s);},0),totPlan=shows.length*EP_PLANNED;
var lead=shows.slice().sort(function(a,b){return (b.deep_total||0)-(a.deep_total||0);});
var aggD=shows.filter(function(s){return s.discovery;}).reduce(function(a,s){return {impressions:a.impressions+(s.discovery.impressions||0),plays:a.plays+(s.discovery.plays||0)};},{impressions:0,plays:0});
aggD.conv_pct=aggD.impressions?Math.round(1000*aggD.plays/aggD.impressions)/10:null;
var aggImpr=shows.reduce(function(a,s){return a+((s.impressions&&s.impressions.total)||0);},0);
var aggAud=shows.reduce(function(a,s){return a+(s.audience_size||0);},0);
var AGE_ORDER=['18-22','23-27','28-34','35-44','45-59','60+','60-150'];
function ageRank(b){var i=AGE_ORDER.indexOf(b);return i<0?99:i;}
function ageRowsFor(list){var mp={};list.forEach(function(s){(s.age||[]).forEach(function(a){var br=a.displayName||a.ageBracket;if(!br||br==='Unknown'||br==='0-17')return;var c=(a.genderBreakdown&&a.genderBreakdown.counts)||[];function g(k){var f=c.filter(function(x){return x.gender===k;})[0];return f?f.count:0;}if(!mp[br])mp[br]={m:0,f:0,nb:0};mp[br].m+=g('MALE');mp[br].f+=g('FEMALE');mp[br].nb+=g('NON_BINARY')+g('NOT_SPECIFIED');});});return Object.keys(mp).map(function(br){var r=mp[br];return {br:br,m:r.m,f:r.f,nb:r.nb,n:r.m+r.f+r.nb};}).filter(function(r){return r.n>0;}).sort(function(a,b){return ageRank(a.br)-ageRank(b.br);});}
var ageRowsAll=ageRowsFor(shows);
function aggSources(){var mp={};shows.forEach(function(s){((s.impressions&&s.impressions.sources)||[]).forEach(function(c){mp[c.name]=(mp[c.name]||0)+(c.count||0);});});return mp;}

function svgIco(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
var IC={headphones:'<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2.5" y="14" width="4.5" height="7" rx="2"/><rect x="17" y="14" width="4.5" height="7" rx="2"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',filter:'<path d="M4 5h16l-6 8v5l-4 2v-7Z"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
var SRC_TR={Search:'חיפוש',Home:'מסך הבית',Library:'הספרייה','Other Spotify Features':'אחר'};

function statusStrip(tag){return '<div class="status">'+RB(tag)+'<div class="it"><span class="dot"></span><b>'+nf(o.shows_count||shows.length)+'</b> תוכניות</div><div class="sep"></div><div class="it"><b>'+nf(totPub)+'</b>/'+nf(totPlan)+' פרקים'+tip('episodes')+'</div></div>';}

function leaderboardTable(){
  var mxD=Math.max.apply(null,lead.map(function(s){return s.deep_total||0;}).concat([1]));
  var mxR=Math.max.apply(null,lead.map(function(s){return (s.yt&&s.yt.avg_pct)||0;}).concat([1]));
  var h='<div class="scroll"><table><thead><tr><th>תוכנית</th><th>פרקים</th><th>סך האזנה</th><th>YouTube</th><th>Spotify</th><th>שימור YT</th></tr></thead><tbody>';
  lead.forEach(function(s){var p=s.platforms||{},ret=(s.yt&&s.yt.avg_pct!=null)?s.yt.avg_pct:null;
    h+='<tr><td class="nm">'+esc(s.name)+'</td><td class="num eps"><b>'+pubEps(s)+'</b><span class="epd">/'+EP_PLANNED+'</span></td>'+
    '<td class="cell tot"><span class="cellbar" style="background:'+COL.deep+';width:'+pct(s.deep_total,mxD)+'%"></span><span class="cellv num">'+nf(s.deep_total)+'</span></td>'+
    '<td class="num">'+nf(p.youtube)+'</td><td class="num">'+nf(p.spotify)+'</td>'+
    '<td>'+(ret!=null?'<span class="miniretain"><span class="rb"><span style="width:'+pct(ret,mxR)+'%"></span></span><span class="num">'+ret+'%</span></span>':'<span class="num">–</span>')+'</td></tr>';});
  return h+'</tbody></table></div>';
}

/* full rankings — every metric, every show, who leads */
var MX=[
  {k:'deep',name:'סך האזנה (יוטיוב + ספוטיפיי)',tip:'deep',get:function(s){return s.deep_total;},fmt:nf},
  {k:'watch',name:'שעות צפייה',tip:'watch',get:function(s){return s.yt&&s.yt.watch_hours;},fmt:function(v){return v==null?'–':Math.round(v);}},
  {k:'ytret',name:'שימור YT',tip:'ytret',get:function(s){return s.yt&&s.yt.avg_pct;},fmt:function(v){return v==null?'–':v+'%';}},
  {k:'impr',name:'הצגות ספוטיפיי',tip:'impressions',get:function(s){return s.impressions&&s.impressions.total;},fmt:nf},
  {k:'conv',name:'המרה',tip:'conv',get:function(s){return s.discovery&&s.discovery.conv_pct;},fmt:function(v){return v==null?'–':v+'%';}},
  {k:'reach',name:'חשיפה בסושיאל',tip:'reach',get:function(s){return (s.instagram_views||0)+(s.facebook_views||0);},fmt:nf}
];
function rankMatrix(){
  var h='<div class="scroll"><table class="mx"><thead><tr><th>מדד</th>'+shows.map(function(s){return '<th>'+esc(s.name)+'</th>';}).join('')+'</tr></thead><tbody>';
  MX.forEach(function(mt,mi){
    var vals=shows.map(function(s){var v=mt.get(s);return (v==null||isNaN(v))?null:v;});
    var nn=vals.filter(function(v){return v!=null;});var mx=Math.max.apply(null,nn.concat([1]));
    var leadIdx=vals.indexOf(Math.max.apply(null,nn.concat([-1])));
    h+='<tr><td class="ml" data-exp="mxe-'+mi+'">'+esc(mt.name)+(mt.tip?tip(mt.tip):'')+'</td>';
    shows.forEach(function(s,si){var v=vals[si];h+='<td class="mcell'+(si===leadIdx&&v!=null?' lead-cell':'')+'">'+(v!=null?'<span class="mbar" style="background:'+(si===leadIdx?COL.deep:COL.reach)+';width:'+pct(v,mx)+'%"></span>':'')+'<span class="mv">'+mt.fmt(v)+'</span></td>';});
    h+='</tr>';
    if(mt.tip)h+='<tr id="mxe-'+mi+'" style="display:none"><td colspan="'+(shows.length+1)+'"><div class="mxexp">'+esc(TIPS[mt.tip]||'')+'</div></td></tr>';
  });
  return h+'</tbody></table></div>';
}

/* Spotify's "Discovery journey" (impressions -> plays, last 30 days), as Spotify for Creators shows it.
   It replaced the reached -> interested -> consumed funnel, whose first two steps come back 0 since 01.11.2026. */
function discoveryJourney(d){d=d||aggD;
  return '<div class="funnel">'+
    '<div class="fseg s1"><div class="fl">הצגות'+tip('impressions')+'</div><div class="fv num">'+nf(d.impressions)+'</div><div class="fx">ספוטיפיי הציג את התוכנית</div></div>'+
    '<div class="fconn"><span class="pct num">'+(d.conv_pct!=null?d.conv_pct+'%':'–')+'</span><span class="ar">◀</span></div>'+
    '<div class="fseg s3"><div class="fl">השמעות'+tip('plays')+'</div><div class="fv num">'+nf(d.plays)+'</div><div class="fx">התחילו לנגן פרק</div></div>'+
  '</div>';
}
function sourcesBars(mp){var keys=Object.keys(mp).filter(function(k){return mp[k];});if(!keys.length)return '<div class="sub">אין נתונים</div>';
  var mx=Math.max.apply(null,keys.map(function(k){return mp[k];}).concat([1]));
  return '<div class="bars">'+keys.sort(function(a,b){return mp[b]-mp[a];}).map(function(k){return '<div class="bl"><span>'+esc(SRC_TR[k]||k)+'</span><div class="bb"><span style="width:'+pct(mp[k],mx)+'%;background:var(--sp)"></span></div><span class="num">'+nf(mp[k])+'</span></div>';}).join('')+'</div>';}
var APP_TR={'Apple Podcasts':'אפל','Spotify':'ספוטיפיי','Web Browser':'דפדפן','Other':'אחר'};
function appsBars(apps){apps=(apps||[]).filter(function(a){return a.pct;});if(!apps.length)return '<div class="sub">אין נתונים</div>';
  return '<div class="bars">'+apps.sort(function(a,b){return b.pct-a.pct;}).map(function(a){var nm=a.name||'';var col=nm.indexOf('Spotify')>=0?COL.sp:(nm.indexOf('Apple')>=0?COL.ap:'#7d8ba8');
    return '<div class="bl"><span>'+esc(APP_TR[nm]||nm)+'</span><div class="bb"><span style="width:'+a.pct+'%;background:'+col+'"></span></div><span class="num">'+a.pct+'%</span></div>';}).join('')+'</div>';}
function aggApps(){var mp={};shows.forEach(function(s){(s.apps||[]).forEach(function(a){if(!mp[a.name])mp[a.name]={sum:0,c:0};mp[a.name].sum+=a.pct;mp[a.name].c++;});});return Object.keys(mp).map(function(k){return {name:k,pct:Math.round(mp[k].sum/mp[k].c)};});}
function platformSplit(yt,sp,ap){yt=yt||0;sp=sp||0;ap=ap||0;var tot=yt+sp+ap;if(!tot)return '<div class="sub">אין נתונים</div>';
  var rows=[{n:'YouTube',v:yt,c:COL.yt},{n:'Spotify',v:sp,c:COL.sp},{n:'Apple',v:ap,c:COL.ap}].filter(function(r){return r.v;}).sort(function(a,b){return b.v-a.v;});var mx=rows[0].v;
  return '<div class="bars">'+rows.map(function(r){return '<div class="bl"><span>'+r.n+'</span><div class="bb"><span style="width:'+pct(r.v,mx)+'%;background:'+r.c+'"></span></div><span class="num">'+nf(r.v)+' · '+pct(r.v,tot)+'%</span></div>';}).join('')+'</div>';}
function assetsBlock(tag){var assets=STATUS.assets||[];if(!assets.length)return '';return '<div class="block">'+RB(tag)+'<div class="bh"><h3>נכסי ההפצה · טווח ההגעה</h3></div><div class="sub">הקהל שאפשר להגיע אליו דרך נכסי RE/MAX הקיימים.</div><div class="chrow" style="flex-wrap:wrap;gap:8px">'+assets.map(function(a){return '<div class="chip" style="flex:1 1 92px;text-align:center"><div class="cn num" style="font-size:15px">'+esc(a.value)+'</div><div class="cl">'+esc(a.channel)+'</div></div>';}).join('')+'</div></div>';}
/* only current numbers: public subscriber text, and impressions/CTR of the podcast
   episodes from the latest Studio export. A chip with no current number is left out. */
function ytChannelBlock(tag){var chips=[];
  if(yc.subscribers_text)chips.push('<div class="chip"><div class="cn num">'+esc(yc.subscribers_text)+'</div><div class="cl">מנויים לערוץ</div></div>');
  if(yc.impressions_lifetime)chips.push('<div class="chip"><div class="cn num">'+nf(yc.impressions_lifetime)+'</div><div class="cl">הצגות של הפרקים</div></div>');
  if(yc.ctr_pct!=null)chips.push('<div class="chip"><div class="cn num">'+yc.ctr_pct+'%</div><div class="cl">CTR'+tip('ctr')+'</div></div>');
  if(!chips.length)return '';
  return '<div class="block">'+RB(tag)+'<div class="bh"><span class="btag" style="background:rgba(255,106,90,.14);color:var(--yt)">YouTube</span><h3>הערוץ והפרקים</h3></div><div class="sub">הצגות ו-CTR של פרקי הפודקאסט מאז שעלו.</div><div class="chrow">'+chips.join('')+'</div></div>';}
function ageBars(rows){rows=rows||ageRowsAll;if(!rows.length)return '<div class="sub">מדגם קטן מדי לפילוח אמין</div>';
  var mx=Math.max.apply(null,rows.map(function(r){return r.n;}).concat([1]));
  return '<div class="glegend"><span><i style="background:'+COL.male+'"></i>גברים</span><span><i style="background:'+COL.female+'"></i>נשים</span><span><i style="background:'+COL.nb+'"></i>אחר</span></div><div class="demo">'+rows.map(function(a){return '<div class="dl"><span>'+esc(a.br)+'</span><div class="db"><span style="width:'+pct(a.m,mx)+'%;background:'+COL.male+'"></span><span style="width:'+pct(a.f,mx)+'%;background:'+COL.female+'"></span><span style="width:'+pct(a.nb,mx)+'%;background:'+COL.nb+'"></span></div><span class="num">'+nf(a.n)+'</span></div>';}).join('')+'</div>';}
function socialPages(){var pages=social.by_page||[];var mx=Math.max.apply(null,pages.map(function(p){return p.views||0;}).concat([1]));
  return pages.map(function(p){var col=p.platform==='Instagram'?COL.ig:COL.fb;var nm=p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.page)+'</a>':esc(p.page);
    return '<div class="pg"><div><span class="nm">'+nm+'</span><span class="tag-sm">'+(p.platform==='Instagram'?'IG':'FB')+' · '+esc(p.type)+'</span><div class="meta">'+nf(p.posts)+' פוסט'+(p.posts>1?'ים':'')+'</div></div><div class="vv num">'+nf(p.views)+'</div><div class="bar"><span style="width:'+pct(p.views,mx)+'%;background:'+col+'"></span></div></div>';}).join('');}
function topPosts(list,n){list=(list||social.posts||[]).slice().sort(function(a,b){return (b.views||0)-(a.views||0);}).slice(0,n||6);
  return list.map(function(pp){var inner='<div><div class="pl">'+esc(pp.label||'ריל')+(pp.url?'<span class="lk">↗ פתח</span>':'')+'</div><div class="pmeta">'+esc(pp.account)+' · '+(pp.split||({Instagram:'אינסטגרם',Facebook:'פייסבוק'})[pp.platform]||pp.platform)+' · ❤ '+nf(pp.likes)+'</div></div><div class="pv num" style="color:'+(pp.platform==='Instagram'?COL.ig:COL.fb)+'">'+nf(pp.views)+'</div>';
    return pp.url?'<a class="post" href="'+esc(pp.url)+'" target="_blank" rel="noopener">'+inner+'</a>':'<div class="post">'+inner+'</div>';}).join('')||'<div class="sub">אין פוסטים</div>';}

/* ============ OVERVIEW (rich, one page) ============ */
function buildOverview(){
  var dAgg=depthAgg();

/* ===== עומק האזנה — הר ספוטיפיי (כותרת) + שימור יוטיוב (מספר-משנה), בנפרד ===== */
function depthFor(s){
  var big=(s.curves||[]).filter(function(e){return (e.count||0)>=10;});
  var y=s.yt||{},yt=(y.avg_pct!=null)?{pct:y.avg_pct,dur:y.avg_dur,w:y.views||y.unique_viewers||0}:null;
  var sp=null;
  if(big.length){
    var tot=big.reduce(function(a,e){return a+e.count;},0);
    function wpt(p){return big.reduce(function(a,e){var r=e.retention||{};var v=(r[p]!=null?r[p]:(r[''+p]||0))||0;return a+v*e.count;},0)/tot;}
    var r25=wpt(25),r50=wpt(50),r75=wpt(75),r100=wpt(100),ys=[100,r25,r50,r75,r100],auc=0,i;
    for(i=0;i<4;i++)auc+=(ys[i]+ys[i+1])/2*25;auc/=100; /* האחוז הממוצע מהפרק שנצרך בספוטיפיי */
    var dur=big.reduce(function(a,e){return a+((e.duration_sec||0)*e.count);},0)/tot/60;
    sp={pts:ys.map(function(v){return Math.round(v);}),depthPct:Math.round(auc),mins:Math.round(auc/100*dur),dur:Math.round(dur),w:tot,aucRaw:auc,minsRaw:auc/100*dur};
  }
  return {sp:sp,yt:yt,spStreams:s.spotify_streams||0};
}
/* גרף-שטח (הר שיורד) מ-5 נקודות השימור.
   הקו/השטח ב-SVG נמתח לרוחב (viewBox 0..100) עם vector-effect לעובי-קו קבוע;
   ספרות הצירים והנקודות הן HTML (לא נמתחות → תמיד חדות). mini=ללא צירים. */
function depthArea(pts,gid,mini){
  var xs=[0,25,50,75,100];
  function svg(sw){
    var ln='M'+pts.map(function(v,i){return xs[i]+' '+(100-v);}).join(' L ');
    var fill=ln+' L 100 100 L 0 100 Z';
    var grid=mini?'':[0,50,100].map(function(v){return '<line x1="0" y1="'+(100-v)+'" x2="100" y2="'+(100-v)+'" stroke="rgba(255,255,255,.07)" vector-effect="non-scaling-stroke"/>';}).join('');
    return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--deep)" stop-opacity=".5"/><stop offset="1" stop-color="var(--deep)" stop-opacity=".05"/></linearGradient></defs>'+grid+'<path d="'+fill+'" fill="url(#'+gid+')"/><path d="'+ln+'" fill="none" stroke="var(--deep)" stroke-width="'+sw+'" vector-effect="non-scaling-stroke"/></svg>';
  }
  if(mini)return '<div class="daplot mini">'+svg(1.8)+'</div>';
  var dots=pts.map(function(v,i){return '<i class="dadot" style="left:'+xs[i]+'%;bottom:'+v+'%"></i>';}).join('');
  return '<div class="daxwrap"><div class="dayax"><span>100%</span><span>50%</span><span>0%</span></div>'+
    '<div class="daplot">'+svg(2.4)+dots+'</div>'+
    '<div class="daxax">'+xs.map(function(x){return '<span>'+x+'%</span>';}).join('')+'</div></div>';
}
/* בלוק העומק בטאב של כל תוכנית — הר ספוטיפיי (כותרת) + שימור יוטיוב (משני) */
function depthBlock(s,idx){var d=depthFor(s);
  if(d.sp){
    var yts=d.yt?' &nbsp;·&nbsp; ביוטיוב '+d.yt.pct+'% שימור'+(d.yt.dur?' ('+d.yt.dur+')':''):'';
    return '<div class="block deep">'+RB('S'+idx+'g')+'<div class="bh"><span class="btag d">עומק</span><h3>עד כמה מקשיבים לפרק'+tip('depth')+'</h3></div><div class="sub">ספוטיפיי · מתוך מי שהתחיל את הפרק — איזה אחוז עוד מאזין בכל נקודה לאורך הפרק.</div>'+depthArea(d.sp.pts,'da'+idx,false)+'<div class="explain" style="margin-top:11px">בממוצע מאזינים ל-<b>'+d.sp.depthPct+'%</b> מהפרק · כ-'+d.sp.mins+' דק׳ מתוך '+d.sp.dur+yts+'</div></div>';
  }
  if(d.yt)return '<div class="block deep">'+RB('S'+idx+'g')+'<div class="bh"><span class="btag d">עומק</span><h3>עד כמה צופים בפרק'+tip('depth')+'</h3></div><div class="sub">הקהל בספוטיפיי קטן כאן ('+nf(d.spStreams)+' האזנות) — לעקומה דרוש יותר. העומק כאן נמדד ביוטיוב.</div><div class="ytdepth"><span class="v">'+d.yt.pct+'%</span><span class="x">שימור ביוטיוב'+(d.yt.dur?' · כ-'+d.yt.dur+' צפייה ממוצעת':'')+'</span></div></div>';

/* השוואת עומק בין כל התוכניות (סקירה) — small-multiples; הר=ספוטיפיי, מתחת=שימור יוטיוב */
function depthCompare(){
  var rows=shows.map(function(s){return {name:s.name,d:depthFor(s)};});
  rows.sort(function(a,b){return ((b.d.sp&&b.d.sp.depthPct)||-1)-((a.d.sp&&a.d.sp.depthPct)||-1);});
  return '<div class="depthmm">'+rows.map(function(r,i){var d=r.d;
    var head='<div class="mmh"><span class="nm">'+esc(r.name)+'</span>'+(d.sp?'<span class="pc">'+d.sp.depthPct+'% · '+d.sp.mins+'ד׳</span>':'')+'</div>';
    var body=d.sp?depthArea(d.sp.pts,'dm'+i,true)+'<div class="mmsp">'+(d.yt?'יוטיוב '+d.yt.pct+'%':'ספוטיפיי')+'</div>':'<div class="mmfb">קהל ספוטיפיי קטן<br>'+(d.yt?'יוטיוב '+d.yt.pct+'%':'אין נתונים')+'</div>';
    return '<div class="mmcell">'+head+body+'</div>';
  }).join('')+'</div>';
}
/* עומק מצרפי ספוטיפיי (כותרת) + שימור יוטיוב מצרפי (משני) לכרטיס בסקירה */
function depthAgg(){var n=0,d=0,m=0,yn=0,yd=0;shows.forEach(function(s){var x=depthFor(s);if(x.sp){n+=x.sp.aucRaw*x.sp.w;d+=x.sp.w;m+=x.sp.minsRaw*x.sp.w;}if(x.yt){yn+=x.yt.pct*x.yt.w;yd+=x.yt.w;}});return {pct:d?Math.round(n/d):null,mins:d?Math.round(m/d):null,ytPct:yd?Math.round(yn/yd):null};}

/* ============ BENCHMARK (large-sample, honest) ============ */
function buildBenchmark(){
  var v2=B.v2;
  if(!v2||!v2.portfolio_stats){return '<div class="block"><div class="bh"><h3>מול השוק</h3></div><div class="sub">נתוני benchmark לא זמינים.</div></div>';}
  var ps=v2.portfolio_stats,dist=v2.distribution||[],rp=v2.remax_position||[];
  var maxC=Math.max.apply(null,dist.map(function(d){return d.count;}).concat([1]));
  var BK=[[0,49],[50,99],[100,199],[200,399],[400,799],[800,1599],[1600,3199],[3200,1e9]];
  function bucketOf(v){for(var i=0;i<BK.length;i++){if(v>=BK[i][0]&&v<=BK[i][1])return i;}return -1;}
  var rmx={};rp.forEach(function(r){var b=bucketOf(r.month1_plays);if(b>=0)(rmx[b]=rmx[b]||[]).push(r.name);});
  var W=640,H=210,pb=42,pt=12,pl=6,n=dist.length,bw=(W-pl*2)/n,bars='';
  dist.forEach(function(d,i){var h=(d.count/maxC)*(H-pt-pb),x=pl+i*bw,y=pt+(H-pt-pb-h),has=rmx[i];
    bars+='<rect x="'+(x+bw*0.13).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.74).toFixed(1)+'" height="'+Math.max(1,h).toFixed(1)+'" rx="3" fill="'+(has?COL.deep:'rgba(54,214,198,.38)')+'"/>'+
      '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" fill="#9aa2b2" font-size="10.5" font-weight="700" text-anchor="middle">'+d.count+'</text>'+
      '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-pb+14)+'" fill="#6b7488" font-size="9.5" text-anchor="middle">'+esc(d.bucket)+'</text>'+
      (has?'<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-pb+27)+'" fill="#f3a23e" font-size="8.5" font-weight="800" text-anchor="middle">'+esc(has.join(' · ').slice(0,20))+'</text>':'');});

      '<div class="bl"><span>ממירה</span><div class="bb"><span style="width:'+conv+'%;background:var(--deep)"></span></div><span class="num">'+conv+'%</span></div>'+

  /* 2 — איפה נופל הקהל במשפך */
  var aImp=0,aR=0,aI=0,aC=0;shows.forEach(function(s){var f=s.funnel||{};aImp+=(s.impressions&&s.impressions.total)||0;aR+=f.reached||0;aI+=f.interested||0;aC+=f.consumed||0;});
  var stg=[['מהצגה להגעה',pct(aR,aImp)],['מהגעה לבדיקה',pct(aI,aR)],['מבדיקה להאזנה',pct(aC,aI)]];
  var v2='<div class="bars">'+stg.map(function(r){return '<div class="bl"><span>'+r[0]+'</span><div class="bb"><span style="width:'+r[1]+'%;background:'+(r[1]<25?'var(--yt)':'var(--sp)')+'"></span></div><span class="num">'+r[1]+'%</span></div>';}).join('')+'</div>';

  /* 4 — ריכוז הקהל */
  var c4=0,t4=0,m4=0,f4=0,ilSum=0,ilN=0;

  /* ===== מול השוק — ויזואלי, מבוסס-מספרים (בלי פרוזה) ===== */

  function cb(v,l){return '<button class="gbtn" data-gc="'+id+'" data-v="'+v+'" onclick="window.__gtoggle(\''+id+'\','+v+')">'+l+'</button>';}
  function sb(v,l){return '<button class="gbtn" data-gs="'+id+'" data-v="'+v+'" onclick="window.__gseries(\''+id+'\',\''+v+'\')">'+l+'</button>';}
  var modes=(kind==='show')?(mb('ep','לפי פרק')):(mb('show','לפי תוכנית')+mb('ep','לפי פרק'));
  var seriesRow=(kind==='show')?'':('<div class="gbtns">'+sb('agg','מאוחד')+sb('prog','פר-תוכנית')+'</div>');
  return '<div class="block deep">'+RB('GR'+id)+'<div class="bh"><span class="btag d">צמיחה</span><h3>צמיחה · האזנות לפרקים</h3></div>'+
    '<div class="sub">סך האזנות (יוטיוב+ספוטיפיי יחד). בחר חתך ותצוגה.</div>'+
    '<div class="gbtns">'+modes+'</div>'+seriesRow+'<div class="gbtns" id="gcum-'+id+'">'+cb('1','מצטבר')+cb('0','בודד')+'</div>'+
    '<div id="gc-'+id+'" class="gchart" data-kind="'+kind+'"></div><div class="insnote" id="gn-'+id+'"></div></div>';
}
window.__gmode=function(id,v){window.__GMODE[id]=v;var el=$('gc-'+id);window.__renderGC(id,el?el.getAttribute('data-kind'):'agg');};
window.__gtoggle=function(id,v){window.__GCUM[id]=!!v;var el=$('gc-'+id);window.__renderGC(id,el?el.getAttribute('data-kind'):'agg');};
window.__gseries=function(id,v){window.__GSERIES[id]=v;var el=$('gc-'+id);window.__renderGC(id,el?el.getAttribute('data-kind'):'agg');};
window.__renderGrouped=function(id,mode,cum){
  var PAL=[COL.deep,COL.reach,COL.sp,COL.ig,COL.yt];
  var ser=shows.map(function(s,i){var vals;
    if(mode==='ep'){vals=scaleToTotal(((s.curves)||[]).map(function(e){return (e.count||0)+(e.yt_views||0);}),s.deep_total||0);}
    else{var dl=((s.trend)||[]).map(function(x){return x&&x.v!=null?x.v:x;}).filter(function(x){return typeof x==='number';});var raw=[];for(var j=0;j<dl.length;j+=7)raw.push(dl.slice(j,j+7).reduce(function(a,b){return a+b;},0));if(dl.length%7!==0&&raw.length>1){raw[raw.length-2]+=raw[raw.length-1];raw.pop();}vals=scaleToTotal(raw,s.deep_total||0);}
    return {name:s.name.split(' ')[0],c:PAL[i%PAL.length],vals:vals};});
  var nX=Math.max.apply(null,ser.map(function(se){return se.vals.length;}).concat([0]));
  var keep=[];for(var w=0;w<nX;w++){var sm=0;ser.forEach(function(se){sm+=se.vals[w]||0;});if(sm>0)keep.push(w);}
  if(cum){ser.forEach(function(se){var r=0;se.vals=se.vals.map(function(v){r+=(v||0);return r;});});}
  var maxV=1;keep.forEach(function(w){ser.forEach(function(se){if(w<se.vals.length&&se.vals[w]>maxV)maxV=se.vals[w];});});
  var groups='',labs='';
  keep.forEach(function(w,ix){var bars=ser.filter(function(se){return w<se.vals.length;});var gw=Math.max(bars.length*15+(bars.length-1)*4,50);
    groups+='<div class="ggroup" style="width:'+gw+'px">'+bars.map(function(se){var v=se.vals[w]||0;var h=Math.max(0,Math.round(v/maxV*100));return '<span class="gmini" style="height:'+h+'%;background:'+se.c+'" title="'+esc(se.name)+': '+nf(v)+'"></span>';}).join('')+'</div>';
    labs+='<div style="width:'+gw+'px">'+(mode==='ep'?'פרק ':'שבוע ')+(ix+1)+'</div>';});
  var legend='<div class="glegend2">'+ser.map(function(se){return '<span><i style="background:'+se.c+'"></i>'+esc(se.name)+'</span>';}).join('')+'</div>';
  var box=$('gc-'+id);if(box)box.innerHTML=legend+'<div class="gplot grouped">'+groups+'</div><div class="gaxis grouped">'+labs+'</div>';
  var ng=$('gn-'+id);if(ng)ng.textContent='השוואה בין התוכניות בכל '+(mode==='ep'?'פרק':'שבוע')+(cum?' (מצטבר)':'')+'.';
};
function scaleToTotal(raws,target){
  var sum=raws.reduce(function(a,b){return a+b;},0);if(!sum||!target)return raws.map(function(){return 0;});
  var out=raws.map(function(r){return Math.round(r/sum*target);});
  var diff=target-out.reduce(function(a,b){return a+b;},0);if(out.length)out[out.length-1]+=diff;
  return out;
}
function weeklyRawSpotify(list){
  var len=0,arrs=[];list.forEach(function(s){var dl=((s&&s.trend)||[]).map(function(x){return x&&x.v!=null?x.v:x;}).filter(function(x){return typeof x==='number';});arrs.push(dl);len=Math.max(len,dl.length);});
  var daily=[];for(var i=0;i<len;i++){var sum=0;list.forEach(function(s,si){sum+=arrs[si][i]||0;});daily.push(sum);}
  var raw=[];for(var j=0;j<len;j+=7){raw.push(daily.slice(j,j+7).reduce(function(x,y){return x+y;},0));}
  if(len%7!==0&&raw.length>1){raw[raw.length-2]+=raw[raw.length-1];raw.pop();}
  while(raw.length&&raw[0]===0)raw.shift();
  while(raw.length&&raw[raw.length-1]===0)raw.pop();
  return raw;
}
window.__renderGC=function(id,kind){
  var mode=window.__GMODE[id]||'week',cum=window.__GCUM[id]!==false;
  /* "מצטבר" only means something on a time axis (weeks / episodes). On the by-program
     cut it stacked each show onto the previous one, so the last bar showed the whole
     portfolio's total under one program's name — 6,854 next to that show's own 1,275. */
  if(mode==='show')cum=false;
  var cw=$('gcum-'+id);if(cw)cw.style.display=(mode==='show')?'none':'';
  [].forEach.call(document.querySelectorAll('[data-gm="'+id+'"]'),function(b){b.className='gbtn'+(b.getAttribute('data-v')===mode?' on':'');});
  [].forEach.call(document.querySelectorAll('[data-gc="'+id+'"]'),function(b){b.className='gbtn'+(((b.getAttribute('data-v')==='1')===cum)?' on':'');});
  var series=window.__GSERIES[id]||'agg';
  [].forEach.call(document.querySelectorAll('[data-gs="'+id+'"]'),function(b){b.className='gbtn'+(b.getAttribute('data-v')===series?' on':'');});
  if(kind==='agg'&&series==='prog'&&(mode==='week'||mode==='ep')){window.__renderGrouped(id,mode,cum);return;}
  var items=[],note='';
  if(mode==='ep'){
    if(kind==='show'){
      var sh=shows[+id.slice(1)];var raw=((sh&&sh.curves)||[]).map(function(e){return (e.count||0)+(e.yt_views||0);});
      items=scaleToTotal(raw,(sh&&sh.deep_total)||0).map(function(v,i){return {l:'פרק '+(i+1),v:v};});
      note='האזנות לכל פרק'+(cum?' (מצטבר)':'')+' · משוקלל לסך התוכנית.';
    }else{
      var maxEp=0,perShow=shows.map(function(s){var r=((s&&s.curves)||[]).map(function(e){return (e.count||0)+(e.yt_views||0);});var sc=scaleToTotal(r,(s&&s.deep_total)||0);if(sc.length>maxEp)maxEp=sc.length;return sc;});
      for(var i=0;i<maxEp;i++){var sm=0;perShow.forEach(function(sc){if(sc[i]!=null)sm+=sc[i];});items.push({l:'פרק '+(i+1),v:sm});}
      note='פרק '+(cum?'מצטבר — ':'')+'סכום אותו מספר-פרק בכל התוכניות.';
    }
  }else if(mode==='show'){
    var PAL=[COL.deep,COL.reach,COL.sp,COL.ig,COL.yt];
    items=shows.slice().sort(function(a,b){return (b.deep_total||0)-(a.deep_total||0);}).map(function(s,i){return {l:s.name.split(' ')[0],v:s.deep_total||0,c:PAL[i%PAL.length]};});
    note='השוואה בין התוכניות — כל תוכנית בצבע. סך האזנות לכל תוכנית, כמו בטאב שלה.';
  }else{
    var list=(kind==='show')?[shows[+id.slice(1)]]:shows;
    var target=list.reduce(function(a,s){return a+((s&&s.deep_total)||0);},0);
    items=scaleToTotal(weeklyRawSpotify(list),target).map(function(v,i){return {l:'שבוע '+(i+1),v:v};});
    note='האזנות לפי שבוע'+(cum?' (מצטבר)':'')+' · משוקלל; מבוסס דפוס ספוטיפיי היומי.';
  }
  if(cum){var r=0;items=items.map(function(it){r+=it.v;return {l:it.l,v:r};});}
  var ng=$('gn-'+id);if(ng)ng.textContent=note;
  var box=$('gc-'+id);if(!box)return;
  if(!items.length){box.innerHTML='<div class="sub">אין עדיין מספיק נתונים</div>';return;}
  var maxV=Math.max.apply(null,items.map(function(it){return it.v;}).concat([1]));
  box.innerHTML='<div class="gplot">'+items.map(function(it){var h=Math.max(3,Math.round(it.v/maxV*100));return '<div class="gbar"><span class="gv num">'+nf(it.v)+'</span><span class="gcol" style="height:'+h+'%;background:'+(it.c||COL.deep)+'"></span></div>';}).join('')+'</div><div class="gaxis">'+items.map(function(it){return '<div>'+esc(it.l)+'</div>';}).join('')+'</div>';
};

var TABS=[{k:'ov',name:'סקירה'},{k:'status',name:'סטטוס'}].concat(shows.map(function(s,i){return {k:'s'+i,name:s.name};}));
var tabsEl=$('tabs'),panelsEl=$('panels');
TABS.forEach(function(t,i){var b=document.createElement('button');b.className='tab'+(t.star?' star':'');b.textContent=t.name;b.setAttribute('aria-selected',i===0?'true':'false');b.onclick=function(){sel(i);};tabsEl.appendChild(b);var p=document.createElement('div');p.className='panel'+(i===0?' on':'');p.id='pan'+i;panelsEl.appendChild(p);});
function buildTab(i){var t=TABS[i],p=$('pan'+i);if(p.dataset.built)return;
  try{
    if(t.k==='status')p.innerHTML=buildStatus();
    else if(t.k==='ov'){p.innerHTML=buildOverview();window.__renderGC('ov','agg');}
    else if(t.k==='bm')p.innerHTML=buildBenchmark();
    else if(t.k==='cmp')p.innerHTML=buildCompare();
    else if(t.k==='insights')p.innerHTML=buildInsights();
    else {var idx=+t.k.slice(1);p.innerHTML=buildShow(shows[idx],idx);window.__renderGC('s'+idx,'show');}
  }catch(e){if(window.console)console.error('tab '+t.k,e);p.innerHTML='<div class="block"><div class="bh"><h3>שגיאה</h3></div><div class="sub">'+esc(e&&e.message||e)+'</div></div>';}
  tagEditable(p,t.k);p.dataset.built='1';}
function sel(i){[].forEach.call(tabsEl.children,function(t,j){t.setAttribute('aria-selected',i===j?'true':'false');});buildTab(i);[].forEach.call(panelsEl.children,function(p,j){p.classList.toggle('on',i===j);});window.scrollTo({top:0,behavior:'smooth'});}

/* floating tooltip (position:fixed, never clipped) */
var tf=null,tfa=null;
function showTip(el){hideTip();var txt=el.getAttribute('data-tiptext');if(!txt)return;
  tf=document.createElement('div');tf.className='tipfloat';tf.textContent=txt;document.body.appendChild(tf);
  var r=el.getBoundingClientRect(),tw=tf.offsetWidth,th=tf.offsetHeight;
  var left=Math.max(8,Math.min(r.left+r.width/2-tw/2,window.innerWidth-tw-8));
  var top=r.bottom+8;if(top+th>window.innerHeight-8)top=Math.max(8,r.top-th-8);
  tf.style.left=left+'px';tf.style.top=top+'px';requestAnimationFrame(function(){if(tf)tf.classList.add('show');});
  el.classList.add('active');tfa=el;}
function hideTip(){if(tf){tf.remove();tf=null;}if(tfa){tfa.classList.remove('active');tfa=null;}}
document.addEventListener('pointerover',function(e){if(e.pointerType&&e.pointerType!=='mouse')return;var t=e.target.closest&&e.target.closest('.tip');if(t&&t!==tfa)showTip(t);});
document.addEventListener('pointerout',function(e){if(e.pointerType&&e.pointerType!=='mouse')return;var t=e.target.closest&&e.target.closest('.tip');if(t)hideTip();});
window.addEventListener('scroll',hideTip,true);
document.addEventListener('click',function(e){
  var ml=e.target.closest&&e.target.closest('.ml[data-exp]');
  if(ml){var x=$(ml.getAttribute('data-exp'));if(x)x.style.display=(x.style.display==='table-row')?'none':'table-row';}
  var t=e.target.closest&&e.target.closest('.tip');
  if(t){e.stopPropagation();if(tfa===t)hideTip();else showTip(t);}else hideTip();
});
var EDIT_SELS=['.bh h3','.sub','.inssub','.inssw','.explain','.statcard .t','.statcard .v','.statcard .x','.chip .cl','.insnote','.hmeta span','.status .it'];
function tagEditable(p,tabK){
  EDIT_SELS.forEach(function(sel){[].forEach.call(p.querySelectorAll(sel),function(el,i){
    var key=tabK+'|'+sel+'|'+i;el.setAttribute('data-ekey',key);
    try{var sv=localStorage.getItem('ed:'+key);if(sv!=null)el.innerHTML=sv;}catch(e){}
    el.contentEditable=document.body.classList.contains('editmode')?'true':'false';
  });});
}
document.addEventListener('blur',function(e){var el=e.target;if(el&&el.getAttribute&&el.getAttribute('data-ekey')){try{localStorage.setItem('ed:'+el.getAttribute('data-ekey'),el.innerHTML);}catch(e2){}}},true);
(function(){var t=$('editToggle');if(t)t.onclick=function(){var on=document.body.classList.toggle('editmode');this.classList.toggle('on');
  [].forEach.call(document.querySelectorAll('[data-ekey]'),function(el){el.contentEditable=on?'true':'false';});
  toast(on?'מצב עריכה — לחץ על כותרת/טקסט כדי לשנות. נשמר בדפדפן שלך.':'מצב עריכה כבוי');};})();
(function(){var hdr=document.querySelector&&document.querySelector('header');if(hdr)tagEditable(hdr,'hdr');})();
(function(){var x=$('exportEdits');if(!x)return;x.onclick=function(){var o={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('ed:')===0)o[k.slice(3)]=localStorage.getItem(k);}}catch(e){}
  var keys=Object.keys(o);if(!keys.length){toast('אין שינויי-עריכה שמורים');return;}
  var txt=keys.map(function(k){return k+'  →  '+o[k];}).join('\n');
  try{navigator.clipboard.writeText(txt);toast(keys.length+' שינויים הועתקו ללוח — הדבק לי כאן ואקבע אותם בקוד');}catch(e){window.prompt('העתק ושלח לי:',txt);}};})();
buildTab(0);
})();
</script>
